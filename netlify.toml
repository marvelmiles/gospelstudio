[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Never cache these, or visitors would keep an old version after an update.
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate"

# Built files get a new name whenever they change, so they can be cached forever.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The analytics report API and the admin dashboard must never be cached or indexed.
[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "no-store"
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/admin/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
