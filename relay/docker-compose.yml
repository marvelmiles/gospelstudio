services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the app address, for example https://gospelstudio.app}
      MAX_SESSIONS: ${MAX_SESSIONS:-100}
      MAX_INGEST_KBPS: ${MAX_INGEST_KBPS:-12000}
      TRUST_PROXY_HOPS: 1
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN to the relay address, for example live.gospelstudio.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
